[project]
name = "spikes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maria Belen Gatti", email = "mbelen.gatti@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cdsapi>=0.7.7",
    "geopandas>=1.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "xarray>=2026.9.0",
]

[project.scripts]
spikes = "spikes:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
